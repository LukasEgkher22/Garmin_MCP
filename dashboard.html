<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d68;
  --mark-muted: #b4b2aa; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --run: #2a78d6; --bike: #eb6834; --swim: #1baf7a; --other: #898781;
  --accent: #6250d6; --fatigue: #e87ba4;
  --z1: #86b6ef; --z2: #5598e7; --z3: #2a78d6; --z4: #1c5cab; --z5: #104281; --z6: #0d366b; --z7: #082a55;
  --good: #0ca30c; --good-text: #006300; --warning: #fab219; --critical: #d03b3b;
  --good-wash: rgba(12,163,12,.09); --critical-wash: rgba(208,59,59,.09);
  --zi1: #0b0b0b; --zi2: #fff; --zi3: #fff; --zi4: #fff; --zi5: #fff; --zi6: #fff; --zi7: #fff;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9b9991;
  --mark-muted: #5e5d58; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
  --run: #3987e5; --bike: #d95926; --swim: #199e70; --other: #898781;
  --accent: #9085e9; --fatigue: #d55181;
  --z1: #184f95; --z2: #256abf; --z3: #3987e5; --z4: #6da7ec; --z5: #9ec5f4; --z6: #b7d3f6; --z7: #cde2fb;
  --good-text: #0ca30c; --good-wash: rgba(12,163,12,.14); --critical-wash: rgba(208,59,59,.16);
  --zi1: #fff; --zi2: #fff; --zi3: #fff; --zi4: #0b0b0b; --zi5: #0b0b0b; --zi6: #0b0b0b; --zi7: #0b0b0b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border); }
.bar { max-width: 1400px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 6px 18px; align-items: center; flex-wrap: wrap; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--ink2); }
nav a:hover { background: var(--wash); }
nav a[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.sync { color: var(--muted); font-size: 12.5px; }
.btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.btn[disabled] { opacity: .55; cursor: default; }
main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; transition: opacity .15s; }
main.busy { opacity: .6; }
.filters { display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 5px 11px; cursor: pointer; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.search { padding: 5px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 220px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 14px; }
.card, .tile, .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.tile { padding: 11px 14px; min-width: 0; }
.tile .label { color: var(--ink2); font-size: 12.5px; }
.tile .value { font-size: 24px; font-weight: 600; line-height: 1.25; }
.tile .value small { font-size: 13px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
.tile .delta { font-size: 12px; color: var(--muted); }
.up-good { color: var(--good-text); }
.up-bad { color: var(--critical); }
.tile svg { display: block; margin-top: 6px; width: 100%; height: 26px; }
.hero { padding: 16px 20px; margin-bottom: 14px; display: flex; gap: 8px 28px; flex-wrap: wrap; align-items: center; }
.hero .figure { font-size: 54px; font-weight: 600; line-height: 1; }
.hero .state { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.hero p { margin: 3px 0 0; color: var(--ink2); max-width: 620px; }
.hero .second { margin-left: auto; padding-left: 22px; border-left: 1px solid var(--grid); max-width: 400px; }
.hero .second b { font-size: 15px; }
.card { padding: 13px 15px 10px; min-width: 0; }
.card + .card:not(.grid > .card) { margin-top: 14px; }
.section { margin-bottom: 14px; }
.card-head { display: flex; gap: 12px; align-items: flex-start; }
.card-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card-head p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
.card-head .btn { margin-left: auto; font-size: 12px; padding: 2px 8px; color: var(--muted); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 13px; margin: 7px 0 2px; font-size: 12.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.plot { width: 100%; margin-top: 4px; }
.plot svg { display: block; overflow: visible; touch-action: pan-y; }
.plot svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
svg text.end { fill: var(--ink2); font-weight: 600; }
.wrap { overflow: auto; max-height: 420px; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink2); position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--grid); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--wash); }
th button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
.name { display: inline-flex; align-items: center; gap: 7px; }
.segbar { display: flex; gap: 2px; height: 28px; margin-top: 8px; }
.segbar div { min-width: 0; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 7px; white-space: nowrap; overflow: visible; }
.empty { color: var(--muted); padding: 34px 10px; text-align: center; }
.banner { background: var(--critical-wash); border: 1px solid var(--critical); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.note { color: var(--muted); font-size: 12.5px; margin: 14px 2px 0; max-width: 880px; }
#tip { position: fixed; z-index: 20; pointer-events: none; display: none; min-width: 120px; max-width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; box-shadow: 0 3px 12px rgba(0,0,0,.16); font-size: 12.5px; }
#tip .t { color: var(--muted); margin-bottom: 3px; }
#tip .r { display: flex; align-items: center; gap: 7px; }
#tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .r span { color: var(--ink2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)) 104px; gap: 1px; background: var(--grid); border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; min-width: 900px; }
.cal > div { background: var(--surface); padding: 5px 6px; min-height: 92px; min-width: 0; }
.cal .dow { min-height: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
.cal .out { background: var(--page); }
.cal .today .num { background: var(--ink); color: var(--surface); border-radius: 4px; padding: 0 5px; font-weight: 600; }
.num { color: var(--muted); font-size: 12px; display: inline-block; margin-bottom: 3px; }
.chip { display: block; text-decoration: none; padding: 3px 5px; margin-bottom: 3px; border-radius: 5px; background: var(--wash); font-size: 12px; line-height: 1.3; }
.chip:hover { outline: 1px solid var(--axis); }
.chip .ttl { display: flex; align-items: center; gap: 5px; font-weight: 600; }
.chip .ttl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .meta { color: var(--ink2); }
.chip.plan { background: none; border: 1px solid var(--axis); }
.chip.plan .meta { color: var(--muted); }
.wk { font-size: 12px; color: var(--ink2); }
.wk b { display: block; color: var(--ink); font-size: 13px; }
.route { display: block; width: 100%; }
</style>
</head>
<body>
<header><div class="bar">
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span class="sync" id="syncText" role="status"></span>
  <button class="btn" id="syncBtn" type="button">Sync</button>
  <button class="btn" id="themeBtn" type="button">Theme</button>
</div></header>
<main id="main"></main>
<div id="tip" role="status"></div>
<script>
"use strict";
window.addEventListener("error", e => showError(e.message));
window.addEventListener("unhandledrejection", e => showError(e.reason && e.reason.message || String(e.reason)));
function showError(msg) {
  const main = document.getElementById("main");
  main.prepend(h("div", {class: "banner"}, "Something went wrong: " + msg));
}

/* ---------------------------------------------------------------- DOM helpers */
const SVG_NS = "http://www.w3.org/2000/svg";

/* ---------------------------------------------------------------- dates (UTC day numbers, so DST never shifts a day) */
const dn = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5;

const dayFmt = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
const dayShort = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "short", timeZone: "UTC"});
const dowFmt = new Intl.DateTimeFormat("en-GB", {weekday: "short", timeZone: "UTC"});
const monFmt = new Intl.DateTimeFormat("en-GB", {month: "short", timeZone: "UTC"});
const monYearFmt = new Intl.DateTimeFormat("en-GB", {month: "long", year: "numeric", timeZone: "UTC"});
const toDate = n => new Date(n * 864e5);
const fmtDay = n => dayFmt.format(toDate(n));
const fmtDayW = n => dowFmt.format(toDate(n)) + " " + dayFmt.format(toDate(n));

/* ---------------------------------------------------------------- number formats */
const nf0 = new Intl.NumberFormat("en-GB", {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat("en-GB", {maximumFractionDigits: 1});
const int = v => v == null || isNaN(v) ? "–" : nf0.format(v);
const one = v => v == null || isNaN(v) ? "–" : nf1.format(v);
const signed = (v, f = one) => (v > 0 ? "+" : v < 0 ? "−" : "") + f(Math.abs(v));
const km = m => m == null ? "–" : one(m / 1000) + " km";
const hours = sec => sec == null ? "–" : one(sec / 3600) + " h";
function clock(sec) {
  if (sec == null || isNaN(sec)) return "–";
  sec = Math.round(sec);
  const H = Math.floor(sec / 3600), M = Math.floor(sec % 3600 / 60), S = sec % 60;
  return H ? `${H}:${String(M).padStart(2, "0")}:${String(S).padStart(2, "0")}` : `${M}:${String(S).padStart(2, "0")}`;
}
function paceFor(sport, mps) {
  if (!mps) return "–";
  if (sport === "run") return clock(1000 / mps) + " /km";
  if (sport === "swim") return clock(100 / mps) + " /100m";
  return one(mps * 3.6) + " km/h";
}
const axisNum = v => Math.abs(v) >= 10000 ? nf1.format(v / 1000) + "K" : nf0.format(v);

/* ---------------------------------------------------------------- state and data */
const SPORTS = {
  run: {label: "Run", color: "var(--run)"},
  bike: {label: "Bike", color: "var(--bike)"},
  swim: {label: "Swim", color: "var(--swim)"},
  other: {label: "Other", color: "var(--other)"},
};
const SPORT_KEYS = Object.keys(SPORTS);
const RANGES = {"1w": 7, "6w": 42, "3m": 91, "6m": 182, "1y": 365, "2y": 730, "All": null};
const TABS = [["fitness", "Fitness"], ["training", "Training"], ["recovery", "Recovery"],
              ["performance", "Performance"], ["calendar", "Calendar"], ["activities", "Activities"]];
const S = {range: "6w", sport: "all", search: "", sort: ["day", -1], shown: 100, calMonth: null, data: null};
const FITNESS_DAYS = 42, FATIGUE_DAYS = 7;

function sportOf(type) {
  if (/run/.test(type)) return "run";
  if (/cycl|bik|virtual_ride/.test(type)) return "bike";
  if (/swim/.test(type)) return "swim";
  return "other";
}
function cleanDay(r) {
  const out = {...r};
  // Garmin marks "not enough data" with negative stress values.
  if (out.stress != null && out.stress <= 0) delete out.stress;
  // Without overnight wear the resting HR is taken from a few daytime readings and runs far too high.
  if (out.sleep == null) delete out.rhr;
  return out;
}
function prepare(raw) {
  const parents = raw.activities.filter(a => a.parent);
  const within = a => parents.some(p => {
    if (p === a) return false;
    const start = Date.parse(p.startTimeLocal.replace(" ", "T")), t = Date.parse(a.startTimeLocal.replace(" ", "T"));
    return t >= start && t < start + (p.duration || 0) * 1000;
  });
  // A multisport event is stored as one parent; a stray listed child would count it twice.
  const sorted = raw.activities.slice().sort((a, b) => a.startTimeLocal < b.startTimeLocal ? -1 : 1);
  const acts = sorted.filter(a => !within(a)).map(a => ({
    raw: a, id: a.activityId, name: a.activityName || a.type, type: a.type, sport: sportOf(a.type),
    day: dn(a.startTimeLocal), time: a.startTimeLocal.slice(11, 16), dist: a.distance || 0,
    moving: a.movingDuration || a.duration || 0, speed: a.averageSpeed, hr: a.averageHR, maxHr: a.maxHR,
    elev: a.elevationGain || 0, load: a.activityTrainingLoad || 0, np: a.normPower, tss: a.trainingStressScore,
    te: a.aerobicTrainingEffect, power: a.avgPower,
  }));
  const today = dn(raw.today);
  const days = new Map(Object.entries(raw.days).map(([k, v]) => [dn(k), cleanDay(v)]));
  return {acts, rawActs: sorted, days, today, profile: raw.profile || {}, lastSync: raw.lastSync, staleAfter: raw.staleAfter, cache: {}};
}
const inSport = a => S.sport === "all" || a.sport === S.sport;
const useMonths = () => RANGES[S.range] == null || RANGES[S.range] > 200;
const useDays = () => RANGES[S.range] != null && RANGES[S.range] <= 14;
function rangeStart() {
  const D = S.data, span = RANGES[S.range];
  if (span == null) return D.acts.length ? monthStart(D.acts[0].day) : D.today - 365;
  if (useDays()) return D.today - span + 1;
  return useMonths() ? monthStart(D.today - span) : monday(D.today - span);
}
const inRange = a => a.day >= rangeStart() && a.day <= S.data.today;
const rangeActs = () => S.data.acts.filter(a => inSport(a) && inRange(a));
function previousActs() {
  const start = rangeStart(), span = S.data.today - start + 1;
  return S.data.acts.filter(a => inSport(a) && a.day >= start - span && a.day < start);
}
const sumOf = (list, f) => list.reduce((t, a) => t + (f(a) || 0), 0);
function dayRange(from, to) { const out = []; for (let d = from; d <= to; d++) out.push(d); return out; }

/* Fitness = 42-day and fatigue = 7-day exponentially weighted load; form = (fitness - fatigue) / fitness. */
function fitnessSeries(sport) {
  const D = S.data, key = "fit:" + sport;
  if (D.cache[key]) return D.cache[key];
  const list = D.acts.filter(a => sport === "all" || a.sport === sport);
  const start = D.acts.length ? D.acts[0].day : D.today;
  const days = dayRange(start, D.today), load = new Map();
  for (const a of list) load.set(a.day, (load.get(a.day) || 0) + a.load);
  const ctlK = 1 - Math.exp(-1 / FITNESS_DAYS), atlK = 1 - Math.exp(-1 / FATIGUE_DAYS);
  let ctl = 0, atl = 0;
  const out = {days, ctl: [], atl: [], form: [], index: d => d - start};
  for (const d of days) {
    const L = load.get(d) || 0;
    ctl += (L - ctl) * ctlK; atl += (L - atl) * atlK;
    out.ctl.push(ctl); out.atl.push(atl);
    out.form.push(ctl >= 1 ? (ctl - atl) / ctl * 100 : null);
  }
  return D.cache[key] = out;
}
const FORM_ZONES = [
  {lo: -Infinity, hi: -30, name: "High risk", icon: "▲", color: "var(--critical)", wash: "var(--critical-wash)", text: "Recent load is far above your 42-day average. Usual during a quick ramp-up, so read it alongside HRV, sleep and how you feel."},
  {lo: -30, hi: -10, name: "Optimal", icon: "●", color: "var(--good)", wash: "var(--good-wash)", text: "Productive training stress: fatigue moderately above fitness."},
  {lo: -10, hi: 5, name: "Grey zone", icon: "◆", color: "var(--muted)", text: "Maintaining. Not enough stress to build much, not rested enough to race."},
  {lo: 5, hi: 20, name: "Fresh", icon: "◇", color: "var(--muted)", text: "Rested and ready to perform."},
  {lo: 20, hi: Infinity, name: "Transition", icon: "▽", color: "var(--muted)", text: "Well rested, but fitness is starting to fade."},
];
const zoneOf = v => FORM_ZONES.find(z => v >= z.lo && v < z.hi) || FORM_ZONES[2];

function dayValues(from, to, key) { const D = S.data; return dayRange(from, to).map(d => { const r = D.days.get(d); return r && r[key] != null ? r[key] : null; }); }
function rolling(values, win, minN = 1) {
  return values.map((_, i) => {

function latest(key, within = 45) {
  const D = S.data;
  for (let d = D.today; d >= D.today - within; d--) { const r = D.days.get(d); if (r && r[key] != null) return {day: d, value: r[key]}; }

}
function meanOf(key, from, to) {
  const v = dayValues(from, to, key).filter(x => x != null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;

/* ---------------------------------------------------------------- tooltip */
const tip = document.getElementById("tip");
function showTip(title, rows, x, y) {
  tip.replaceChildren(h("div", {class: "t"}, title), ...rows.map(r =>
    h("div", {class: "r"}, r.color ? h("span", {class: "key-line", style: `background:${r.color}`}) : null, h("b", null, r.value), h("span", null, r.name))));
  tip.style.display = "block";
  const w = tip.offsetWidth, ht = tip.offsetHeight;
  tip.style.left = Math.max(6, x + 14 + w > innerWidth ? x - w - 14 : x + 14) + "px";
  tip.style.top = Math.max(6, Math.min(innerHeight - ht - 6, y - ht / 2)) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
addEventListener("scroll", hideTip, {passive: true});

/* ---------------------------------------------------------------- axes */
function niceTicks(lo, hi, count = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const ticks = [];

}
function dateTicks(from, to, width) {

    return out;

  if (span <= 120) {
    let step = 7; while (span / step > maxTicks) step += 7;
    for (let d = monday(from) + 7; d <= to; d += step) out.push({v: d, label: dayShort.format(toDate(d))});

  let d = monthStart(from);

  if (st.hr) defs.push({title: "Heart rate", unit: "bpm", values: clean(st.hr), fmt: v => `${int(v)} bpm`, color: "var(--accent)"});
  if (st.speed) {
    if (a.sport === "run") defs.push({title: "Pace", unit: "min/km", values: clean(st.speed, v => v > .7 ? 1000 / v : null), invert: true, yFmt: clock, fmt: v => `${clock(v)} /km`, color, clampPct: .02});
    else if (a.sport !== "swim") defs.push({title: "Speed", unit: "km/h", values: clean(st.speed, v => v * 3.6), fmt: v => `${one(v)} km/h`, color, zero: true});
  }
  if (st.power) defs.push({title: "Power", unit: "W", values: rolling(clean(st.power), 5), fmt: v => `${int(v)} W`, color, zero: true});
  if (st.cad) defs.push({title: "Cadence", unit: a.sport === "run" ? "spm" : "rpm", values: clean(st.cad, v => v > 0 ? v : null), fmt: v => `${int(v)}`, color: "var(--muted)"});
  if (st.ele) defs.push({title: "Elevation", unit: "m", values: clean(st.ele), fmt: v => `${int(v)} m`, color: "var(--muted)"});
  const left = h("div", {class: "grid"});
  if (t.length) for (const def of defs) {
    left.append(card({title: def.title, sub: def.unit,
      table: () => ({cols: ["Time", {name: `${def.title} (${def.unit})`, n: 1}], rows: t.map((v, i) => [clock(v), def.values[i] == null ? null : (def.yFmt || int)(def.values[i])]).filter(r => r[1] != null)}),
      draw: (el, W) => { group.length = Math.min(group.length, defs.length); lineChart(el, W, {x: t, h: 130, aria: def.title, group, invert: def.invert, yFmt: def.yFmt, zero: def.zero, clampPct: def.clampPct, ml: 46, xTicks: xTicks(W), xTitle: v => `At ${clock(v)}`, tickCount: 3,
        series: [{name: def.title, color: def.color, values: def.values, fmt: def.fmt, tipFmt: def.fmt}]}); }}));
  }
  const side = h("div", {class: "grid", style: "align-content:start"});
  if (d.route && d.route.length > 1) side.append(h("section", {class: "card"},
    h("div", {class: "card-head"}, h("div", null, h("h2", null, "Route"), h("p", null, "Shape only, no map tiles, so your location stays on this PC"))),
    routeSvg(d.route, color)));
  const zoneParts = ZONES5.map((z, i) => ({name: z.name, color: z.color, value: a.raw[z.key] || 0, ink: `var(--zi${i + 1})`}));
  if (zoneParts.some(p => p.value)) side.append(card({title: "Time in heart-rate zones", draw: el => el.replaceChildren(segmented(zoneParts))}));
  host.append(h("div", {class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px"},
    h("div", {style: "grid-column:span 2;min-width:0"}, left), side));
  if (d.laps && d.laps.length) {
    const cad = d.laps.some(l => l.averageBikeCadence) ? "averageBikeCadence" : "averageRunCadence";
    host.append(h("section", {class: "card"}, h("div", {class: "card-head"}, h("div", null, h("h2", null, `Laps (${d.laps.length})`))),
      h("div", {class: "wrap"}, h("table", null,
        h("thead", null, h("tr", null, ["#", "Distance", "Time", "Pace / speed", "Avg HR", "Max HR", "Power", "NP", "Cadence", "Elevation"].map((c, i) => h("th", {class: i ? "n" : null}, c)))),
        h("tbody", null, d.laps.map((l, i) => h("tr", null, [i + 1, l.distance ? km(l.distance) : "–", clock(l.movingDuration || l.duration), paceFor(a.sport, l.averageSpeed), int(l.averageHR), int(l.maxHR),
          l.averagePower ? `${int(l.averagePower)} W` : "–", l.normalizedPower ? `${int(l.normalizedPower)} W` : "–", int(l[cad]), l.elevationGain ? `${int(l.elevationGain)} m` : "–"].map((v, j) => h("td", {class: j ? "n" : null}, String(v))))))))));
  }
}

/* ---------------------------------------------------------------- shell */
const VIEWS = {fitness: viewFitness, training: viewTraining, recovery: viewRecovery, performance: viewPerformance, calendar: viewCalendar, activities: viewActivities};
let renderToken = 0;
function flushCharts() { for (const c of pending) { c.plot.__draw = c.draw; c.draw(); } pending.length = 0; }
function render() {
  renderToken++;
  hideTip();
  const main = document.getElementById("main"), route = location.hash.slice(1) || "fitness";
  const [tab, id] = route.split("/");
  const known = tab === "activity" ? "activities" : VIEWS[tab] ? tab : "fitness";
  document.getElementById("nav").replaceChildren(...TABS.map(([k, label]) => h("a", {href: `#${k}`, "aria-current": k === known ? "page" : null}, label)));
  pending.length = 0;
  const scroll = scrollY;
  main.replaceChildren();
  if (!S.data || !S.data.acts.length) {
    main.append(h("div", {class: "empty"}, statusNow && statusNow.running
      ? `Reading your Garmin history for the first time. This takes about a minute. ${statusNow.message || ""}`
      : "No data yet. Press Sync to read your Garmin history."));
    return;
  }
  if (tab === "activity" && id) viewActivity(main, +id);
  else (VIEWS[tab] || viewFitness)(main);
  flushCharts();
  scrollTo(0, scroll);
}
let lastWidth = innerWidth, resizeTimer;
addEventListener("resize", () => {
  if (innerWidth === lastWidth) return;
  lastWidth = innerWidth; clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});
addEventListener("hashchange", () => { scrollTo(0, 0); render(); });

let statusNow = null;
function ago(sec) {
  const m = Math.round((Date.now() / 1000 - sec) / 60);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}
function paintSync() {
  const text = document.getElementById("syncText"), btn = document.getElementById("syncBtn"), st = statusNow || {};
  btn.disabled = !!st.running;
  document.getElementById("main").classList.toggle("busy", !!st.running && !!(S.data && S.data.acts.length));
  if (st.running) text.textContent = st.message || "Syncing";
  else if (st.error) text.textContent = "Sync failed";
  else text.textContent = S.data && S.data.lastSync ? `Synced ${ago(S.data.lastSync)}` : "";
  const old = document.getElementById("syncError"); if (old) old.remove();
  if (!st.running && st.error) document.getElementById("main").prepend(h("div", {class: "banner", id: "syncError"}, st.error));
}
async function loadData() {
  const r = await fetch("api/data");
  if (!r.ok) throw new Error(`Couldn't read local data (${r.status})`);
  S.data = prepare(await r.json());
}
async function poll() {
  statusNow = await (await fetch("api/status")).json();
  paintSync();
  if (statusNow.running) { if (!S.data || !S.data.acts.length) render(); setTimeout(poll, 1500); return; }
  await loadData(); render(); paintSync();
}
async function startSync() {
  await fetch("api/sync", {method: "POST", headers: {"X-Dashboard": "1"}});
  poll();
}
document.getElementById("syncBtn").addEventListener("click", startSync);
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; localStorage.setItem("theme", next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "Light" : "Dark";
});
(function init() {
  const theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
  document.getElementById("themeBtn").textContent = theme === "dark" ? "Light" : "Dark";
  loadData().then(() => {
    render(); paintSync();
    const D = S.data;
    if (!D.lastSync || Date.now() / 1000 - D.lastSync > D.staleAfter) startSync(); else poll();
  });
})();
</script>
